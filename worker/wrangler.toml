name = "conversation-to-ship-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://maximusmaximus.github.io"
FRONTEND_PORTAL_URL = "https://maximusmaximus.github.io/conversation-to-ship/"
MODEL_MATRIX_URL = "https://maximusmaximus.github.io/agentic-model-matrix/routing.json"
DEFAULT_REPO_VISIBILITY = "private"

[[d1_databases]]
binding = "DB"
database_name = "conversation_to_ship"
database_id = "4153e361-4716-449d-ad46-357eb2f17279"

[[r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "conversation-to-ship-artifacts"

# Required secrets (set via `npx wrangler secret put <NAME>` — never commit values):
# - ADMIN_EMAIL           (sole administrator Google email address)
# - SESSION_SECRET        (HMAC-SHA256 JWT + AES-GCM token encryption secret)
# - GOOGLE_CLIENT_ID      (Google OAuth Web Client ID)
#
# Optional click-through OAuth app secrets (for zero-paste 1-click user onboarding):
# - GOOGLE_CLIENT_SECRET
# - GITHUB_CLIENT_ID
# - GITHUB_CLIENT_SECRET
# - CALENDLY_CLIENT_ID
# - CALENDLY_CLIENT_SECRET
# - BRIDGE_WORKER_TOKEN
# - CALENDLY_WEBHOOK_SIGNING_KEY
# - GOOGLE_CALENDAR_WEBHOOK_TOKEN
# - READAI_WEBHOOK_SECRET
