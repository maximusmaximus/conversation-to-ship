name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run zero-leak security scan
        run: python scripts/security_scan.py --root .
      - name: Validate specification and model matrix alignment
        run: python scripts/validate_spec.py --root .
      - name: Run repository and submodule tests
        run: pytest -v
